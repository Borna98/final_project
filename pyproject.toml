[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "documentintelligence"
version = "0.1.0"
description = "Tools for document intelligence"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [ { name = "Farzana Akter" } ]
dependencies = [
    "pandas>=2.0.3",
    "numpy>=1.27.5",
    "scikit-learn>=1.3.2",
    "scipy>=1.12.3",
    "matplotlib>=3.8.2",
    "seaborn>=0.12.3",
    "nltk>=3.9.0",
    "spacy>=4.6.0",
    "gensim>=4.4.3",
    "transformers>=5.4.0",
    "torch>=2.7.1",
    "tensorflow>=2.15.0",
    "keras>=2.15.0",
    "opencv-python>=4.8.1",
    "pdfplumber>=0.10.0",
    "python-docx>=0.8.12",
    "PyPDF2>=3.1.1",
    "tika>=2.6.0"
]


[tool.setuptools.packages.find]
where = ["."]
include = ["documentintelligence*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

